[package]
name = "elite-podcasts"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "A native podcast discovery and playback app for GNOME"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_8"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
